[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formstudio"
version = "0.1.0"
description = "Photo -> house style -> printable 3D (local, Apple Silicon friendly)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "typer>=0.12",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "trimesh>=4.4",
  "manifold3d>=2.5",
  "pymeshlab>=2023.12",
  "scipy>=1.12",
  "shapely>=2.0",
  "rembg[cpu]>=2.0.56",
]

[project.optional-dependencies]
# Real stylize/reconstruct models. Heavy: ~10 GB of weights on first run.
ai = [
  "torch>=2.3",
  "diffusers>=0.30",
  "transformers>=4.41",
  "accelerate>=0.31",
]
hunyuan = ["hy3dgen @ git+https://github.com/Tencent/Hunyuan3D-2.git"]
step = ["cadquery-ocp>=7.7"]
dev = ["pytest>=8"]

[project.scripts]
formstudio = "formstudio.cli:app"

[tool.setuptools.packages.find]
include = ["formstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
