[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formstudio"
version = "0.1.0"
description = "Photo → house style → printable 3D. A local Mac app."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "trimesh>=4.0",
  "manifold3d>=3.0",
  "fast-simplification>=0.1.7",
  "lxml>=5",
  "httpx>=0.27",
  "keyring>=25",
]

[project.optional-dependencies]
# Background removal (downloads a ~170 MB model on first use)
matting = ["rembg>=2.0.50", "onnxruntime>=1.17"]
# Free local AI on Apple Silicon / CUDA / CPU
local-ai = [
  "formstudio[matting]",
  "torch>=2.3",
  "torchvision>=0.18",
  "diffusers>=0.30",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "huggingface-hub>=0.24",
  # TripoSR's own requirements (its code is cloned by scripts/setup-mac.sh)
  "omegaconf>=2.3",
  "einops>=0.7",
  "imageio>=2.34",
  "xatlas>=0.0.9",
]
hunyuan = ["hy3dgen @ git+https://github.com/Tencent/Hunyuan3D-2.git"]
step = ["cadquery-ocp>=7.7"]
heic = ["pillow-heif>=0.16"]
# Fallback window when the native Mac shell isn't built
window = ["pywebview>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
formstudio = "formstudio.desktop:main"
formstudio-cli = "formstudio.cli:main"

[tool.setuptools.packages.find]
include = ["formstudio*"]

[tool.setuptools.package-data]
formstudio = ["web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
