# Low-poly: flat geometric facets, papercraft feel.
id: low-poly
name: Low Poly
version: 1
description: Flat-shaded geometric facets with a crisp papercraft feel.
references: []

prompt: >-
  a {subject} as a low-poly 3D model, flat-shaded triangular facets, crisp geometric
  planes, papercraft feel, matte surface, no smooth curves, no text,
  studio product render, centered, whole object in frame, plain white background,
  soft diffuse light
negative_prompt: >-
  smooth surfaces, high detail, photorealistic texture, text, logo, multiple objects,
  cluttered background, cropped, cast shadow on background
edit_prompt: >-
  Completely redraw this {subject} as a low-poly 3D model made of a few hundred flat
  triangular facets, like papercraft. Keep only its overall silhouette and recognisable
  parts; replace every curve with crisp flat planes with a matte surface,
  no fine detail and no text. Show the whole object centred on a plain white
  background with soft diffuse light.

sculpt_guide: >-
  Geometric and angular: use boxes, cones and cylinders with little or no rounding,
  simple planes, few parts.

seeds: [11, 23, 37, 51]

stylize:
  size: 1024
  steps: 30
  guidance: 6.0
  ip_adapter_scale: 0.6   # how strongly reference.png steers the look
  controlnet_scale: 0.55  # how strongly the photo's shape is kept


geometry:
  finish: faceted        # reduce to flat facets
  facets: 400            # how many flat faces the object keeps
  height_mm: 50
  voxel_mm: 0.5
  soften_mm: 0.4
  min_feature_mm: 2.0
  smooth_iters: 0
  target_faces: 60000
  flat_cut: 0.03

base:
  enabled: true
  margin_mm: 3
  thickness_mm: 3
  fillet_mm: 1.2

magnet:
  enabled: false
  diameter_mm: 6
  depth_mm: 2
  clearance_mm: 0.15

# What the object becomes. The Print step switches between these; each one
# starts from the settings above, with these changes on top.
formats:
  stand:
    label: Stand
  magnet:
    label: Magnet
    geometry: {height_mm: 35}
    base: {enabled: false}
    magnet: {enabled: true, diameter_mm: 10, depth_mm: 2}
    flat_back: {enabled: true, thickness_mm: 9}
  keychain:
    label: Keychain
    geometry: {height_mm: 40}
    base: {enabled: false}
    magnet: {enabled: false}
    flat_back: {enabled: true, thickness_mm: 7}
    ring: {enabled: true, outer_radius_mm: 4.5, hole_mm: 4.5, thickness_mm: 3.5}
